name: Sprawdzenie PRNG
on:
  push:
    paths: [scripts/prng_probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl && python3 scripts/prng_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_prng_probe.json && git commit -m "Sprawdzenie PRNG" && git pull --rebase -q && git push
