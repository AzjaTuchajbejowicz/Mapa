name: Aktualizacja danych mapy

on:
  push:
    paths:
      - scripts/zbuduj_dane.py
      - scripts/skarby.py
      - scripts/karczmy.py
      - scripts/ohm_drogi.py
      - scripts/wikidata.py
      - scripts/wzmianki.py
      - scripts/polacz.py
      - .github/workflows/dane.yml
  schedule:
    - cron: "17 3 * * 1"   # w każdy poniedziałek rano
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dane
  cancel-in-progress: true

jobs:
  dane:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Zainstaluj osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Pobierz dane OpenStreetMap dla Polski (Geofabrik)
        run: curl -sSfL --retry 5 -o polska.osm.pbf https://download.geofabrik.de/europe/poland-latest.osm.pbf
      - name: Wybierz stanowiska, młyny i wiatraki
        run: |
          E=""
          for P in "" disused: abandoned: ruins: demolished: was: razed: destroyed:; do
            for K in man_made building; do E="$E nwr/${P}${K}=watermill,windmill,mill"; done
          done
          osmium tags-filter polska.osm.pbf nwr/historic nwr/heritage nwr/place nwr/building=inn,castle,palace nwr/ruins:historic $E -o wybrane.osm.pbf
          osmium export wybrane.osm.pbf -f geojsonseq -a type,id --geometry-types=point,linestring,polygon -o wybrane.geojsonseq
          mkdir -p data build
          curl -sSfL --retry 5 -o build/poland.poly https://download.geofabrik.de/europe/poland.poly || true
          python3 scripts/zbuduj_dane.py wybrane.geojsonseq
      - name: Uzupełnij z Wikidata (m.in. rejestr zabytków)
        continue-on-error: true
        run: python3 scripts/wikidata.py
      - name: Uzupełnij wzmiankami z Wikipedii (młyny, grodziska, kurhany)
        continue-on-error: true
        run: python3 scripts/wzmianki.py
      - name: Zbierz udokumentowane skarby (Wikipedia, Wikidata)
        continue-on-error: true
        run: python3 scripts/skarby.py
      - name: Dawne drogi z OpenHistoricalMap
        continue-on-error: true
        run: python3 scripts/ohm_drogi.py
      - name: Zbierz karczmy z Wikipedii
        continue-on-error: true
        run: python3 scripts/karczmy.py
      - name: Połącz źródła bez duplikatów
        run: python3 scripts/polacz.py
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Aktualizacja danych z OpenStreetMap"
          git pull --rebase -q
          git push
